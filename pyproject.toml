[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A maze generator and terminal visualizer developed for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tomás" },
  { name = "Kayan" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "flake8>=7.0",
  "mypy>=1.10",
  "build>=1.2"
]

[project.scripts]
a-maze-ing = "a_maze_ing:main"

[tool.setuptools]
packages = ["mazegen"]
py-modules = [
  "a_maze_ing",
  "config_parser",
  "display",
  "output_writer"
]
include-package-data = true

[tool.setuptools.package-data]
mazegen = ["py.typed"]

[tool.flake8]
max-line-length = 79

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
